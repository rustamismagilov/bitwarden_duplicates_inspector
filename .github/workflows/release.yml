name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # the page shows the version from package.json, so the tag has to agree with it
      - name: Check tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the whole history and tags, so the release notes can list the commits since the last tag
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Show the page's checksum
        run: sha256sum dist/index.html | tee -a "$GITHUB_STEP_SUMMARY"

      # commit subjects here are written for people, so they make the release notes
      # version bumps are left out, whether written by hand or made by npm version ("0.0.4")
      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="$GITHUB_REF_NAME"
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; fi
          changes=$(git log --no-merges --format='- %s' "$range" | grep -Ev '^- (Bumped version|v?[0-9]+\.[0-9]+\.[0-9]+$)' || true)
          if [ -n "$changes" ]; then
            printf '## Changes\n\n%s\n' "$changes" > dist/release-notes.md
          else
            : > dist/release-notes.md
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/index.html
            dist/release-notes.md
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # a tag that is pushed again gets a fresh release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/index.html \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --generate-notes
