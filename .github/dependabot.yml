version: 2
updates:
  # a week's wait gives a hijacked release time to be caught before it gets here
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns:
          - '*'

  # one pull request for all action updates, they all touch the same two workflow files
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
