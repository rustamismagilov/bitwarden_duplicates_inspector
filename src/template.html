<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- blocks fetching anything from the network, the page only runs what is inlined here -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src __CSP_SCRIPT_HASH__; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'" />
  <title>Bitwarden Duplicates Inspector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>/*__INLINE_CSS__*/</style>
</head>
<body>
  <button id="themeToggleBtn" type="button" aria-label="Dark theme" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
    </svg>
  </button>

  <div id="top-area">
    <h1>Bitwarden Duplicates Inspector <span class="version">v__VERSION__</span></h1>

    <div id="controls">
      <div class="controls-top">
        <div class="controls-row-left">
          <label class="btn btn-secondary file-label">
            <span id="fileLabelText">Choose file</span>
            <input type="file" id="fileInput" accept=".json,application/json" />
          </label>
        </div>

        <div class="controls-row-right">
          <label class="toggle-wrapper">
            <input type="checkbox" id="previewToggle" />
            Enable result previews
          </label>

          <button id="selectAllGroupsBtn" class="btn btn-secondary" disabled>
            Select all entries in all groups
          </button>

          <button id="mergeAllGroupsBtn" class="btn btn-secondary" disabled>
            Merge all untagged groups
          </button>

          <button id="deleteSelectedBtn" class="btn btn-danger" disabled>
            Mark selected for deletion
          </button>
          <button id="downloadBtn" class="btn btn-primary" disabled>
            Download updated export
          </button>
        </div>
      </div>

      <div id="searchWrapper">
        <input type="text" id="filterInput" aria-label="Filter duplicate groups" placeholder="Filter by site, name, URL or username..." />
        <button id="clearSearchBtn" type="button" aria-label="Clear filter">&times;</button>
      </div>
    </div>

    <div id="status" role="status"></div>
    <div id="summary" aria-live="polite"></div>
    <div class="hint" id="hint" role="status"></div>
  </div>

  <div id="groups"></div>

  <script>/*__INLINE_JS__*/</script>
</body>
</html>
